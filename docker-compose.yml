services:
  gamebrain:
    build: .
    image: gamebrain:latest
    container_name: gamebrain
    restart: unless-stopped
    ports:
      - "8095:8095"
    env_file:
      - .env
    environment:
      PACK_DIR: ${PACK_DIR:-./packs/default}
      PORT: "8095"
      UI_PATH: /app/ui/index.html
    volumes:
      # Mount your packs read-only. Keep them OUTSIDE the repo so a
      # `git pull` never touches them.
      - ./packs:/app/packs:ro
      # If you keep packs elsewhere, mount that path instead, e.g.
      # - /opt/packs:/packs:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8095/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
